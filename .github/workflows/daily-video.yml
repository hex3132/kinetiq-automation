name: Kinetiq Story Daily Video Pipeline

on:
  schedule:
    # Runs at 06:00 Bangladesh time (00:00 UTC) every day.
    # GitHub's cron can be delayed a few minutes during high load — that's normal.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - - name: Install system dependencies (ffmpeg + ImageMagick for moviepy)
     run: |
       sudo apt-get update
       sudo apt-get install -y ffmpeg imagemagick
       sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python src/main.py

      - name: Upload run artifacts (backup, in case Drive upload fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetiq-output-${{ github.run_number }}
          path: output/
          retention-days: 7
